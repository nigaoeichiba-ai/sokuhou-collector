name: yorokobu-compare

# [2026-10-17: the result is no longer committed to the public repository (the Rakuten terms bar keeping API data where many people can read it): it goes to the server's private
# folder, sites/yorokobu/privatedata.py, and the deploy takes it from there.]
# Every day: the Rakuten Ichiba search results of each kind of gift in sites/yorokobu/content/compare.json (price, the shop's point multiplier, shipping, reviews), written to
# data/yorokobu_compare.json for the page /compare/.  Nothing is committed (the file only goes to the private folder); that file; a commit made with the workflow token starts no other workflow, so the pages change
# at the next deploy (the daily one at 07:00 JST, or any push).  Needs RAKUTEN_APP_ID and RAKUTEN_ACCESS_KEY.

on:
  schedule:
    - cron: "20 20 * * *"   # 05:20 JST: about 10 minutes, before the 07:00 deploy
  workflow_dispatch:

permissions:
  contents: read

# Own group (see yorokobu-ranking.yml): a request every 3 s (0.33/s) next to the deploy's fetch stays within the shared limit of the application ID.
concurrency:
  group: yorokobu-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fetch the kinds of gift
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          if [ -z "$RAKUTEN_APP_ID" ] || [ -z "$RAKUTEN_ACCESS_KEY" ]; then
            echo "the Rakuten secrets are not set; nothing to do"
            exit 0
          fi
          python -m sites.yorokobu.compare_fetch --out data/yorokobu_compare.json
      - name: Store the result privately (the server's private folder, never the repository)
        env:
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
        run: python -m sites.yorokobu.privatedata push yorokobu_compare.json
