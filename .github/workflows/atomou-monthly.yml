name: atomou-monthly

# atomou.com: the monitors' questionnaire answers go into data/inbox/ ENCRYPTED every week (the owner's PC reads them with
# `python -m sokuhou.inbox read`; the repository is public), and on the 2nd of each month the thanks of the last month are worked out
# (sites/atomou/monthly.py rank): awards.json (applied by api/m.php on each member's next visit) and thanks.json (the public thanks list,
# consented pen names only) are written back into ~/atomou.com/members/ on the server.  Counts only in the log.
# Needs the deploy secrets XSERVER_SSH_KEY, XSERVER_HOST, XSERVER_USER.  Without them, or without members, it ends quietly.

on:
  schedule:
    - cron: "20 19 * * 0"   # Monday 04:20 JST: export the new answers
    - cron: "40 19 1 * *"   # the 2nd, 04:40 JST: export + the thanks of the last month
  workflow_dispatch:
    inputs:
      rank:
        description: "true = also work out the thanks of the last month"
        default: "false"

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

env:
  SSH_PORT: "10022"

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Gate
        id: gate
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER_ID" ]; then echo "XSERVER secrets are not set; nothing to do"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.13"
      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: python -m pip install --quiet cryptography
      - name: SSH setup
        if: steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          for try in 1 2 3 4 5 6; do
            ssh-keyscan -T 10 -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            [ -s ~/.ssh/known_hosts ] && break
            sleep $((try * 10))
          done
          test -s ~/.ssh/known_hosts
      - name: Copy the members folder from the server
        if: steps.gate.outputs.go == 'true'
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
        run: |
          set -euo pipefail
          mkdir -p members
          ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" \
            'set -e; d="$HOME/atomou.com/members"; if [ -f "$d/key" ]; then cd "$d" && tar -czf - key m $(ls awards.json thanks.json 2>/dev/null) ; else tar -czf - -T /dev/null; fi' | tar -C members -xzf -
      - name: Export the new answers (encrypted)
        if: steps.gate.outputs.go == 'true'
        run: |
          set -euo pipefail
          [ -f members/key ] || { echo "no members yet"; exit 0; }
          mkdir -p data/inbox
          python -m sites.atomou.monthly export --dir members --state data/inbox/state.json --out new_monitor.jsonl
          if [ -s new_monitor.jsonl ]; then
            openssl smime -encrypt -aes256 -binary -in new_monitor.jsonl -out "data/inbox/atomou-monitor-$(date -u +%Y%m%d-%H%M).p7m" -outform DER sokuhou/inbox_cert.pem
          fi
          rm -f new_monitor.jsonl
      - name: The thanks of the last month
        if: steps.gate.outputs.go == 'true' && (github.event.schedule == '40 19 1 * *' || inputs.rank == 'true')
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
        run: |
          set -euo pipefail
          [ -f members/key ] || { echo "no members yet"; exit 0; }
          python -m sites.atomou.monthly rank --dir members
          for f in awards.json thanks.json; do
            ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" \
              "set -e; cd \"\$HOME/atomou.com/members\"; cat > $f.tmp; chmod 600 $f.tmp; mv $f.tmp $f" < "members/$f"
          done
      - name: Forget the copy
        if: always() && steps.gate.outputs.go == 'true'
        run: rm -rf members
      - name: Commit
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "sokuhou-bot"
          git config user.email "sokuhou-bot@users.noreply.github.com"
          git add data/inbox
          if git diff --cached --quiet; then
            echo "no new answers"
          else
            git commit -m "data: atomou monitor answers (encrypted)"
            git pull --rebase origin main
            git push
          fi
