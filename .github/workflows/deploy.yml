name: deploy-sites

# Builds each site and uploads it to Xserver over SSH (one job per site that has something to publish).
# The PLAN job (sokuhou/deployplan.py, reading the site register data/sites.json) decides which sites those are; a site with nothing to do costs no runner.
# A new site is one entry in data/sites.json (docs DEPLOY_REDESIGN_100SITES.md); the matrix, the ownership of files, the tests of a site and the watchdog all follow from it.
# Needs three repository secrets, all created by the owner (never by Claude):
#   XSERVER_SSH_KEY   the private key file from Xserver's SSH settings (whole file, passphrase-free)
#   XSERVER_HOST      e.g. sv8477.xserver.jp
#   XSERVER_USER      the Xserver server ID (the SSH user name)
# The kuma site is built and uploaded only when the repository variable DEPLOY_KUMA is "true" (set after the
# owner has added kuma-sokuho.com to the Xserver server); the same switch for minna-no-illust.com is DEPLOY_MINNA and for atomou.com DEPLOY_ATOMOU.
# atomou is a DEMO until the repository variable ATOMOU_PUBLIC is "true" (release build, indexable). While ATOMOU_REVIEW is "true" and ATOMOU_PUBLIC is not, the small REVIEW copy
# (public to crawlers but not indexable, no password; sites/atomou/review.py) is the site and the full demo rides along in public_html/demo, the folder of demo.atomou.com. A demo is deployed only
# behind a password (HTTP Basic): the secret ATOMOU_DEMO_PASSWORD (owner-made) must exist (the user name is ATOMOU_DEMO_USER, "demo" when that secret is not set), the job writes the password
# file to ~/atomou.com/.htpasswd (outside public_html) and the preview build's .htaccess asks for it. Without them nothing is deployed.
#
# Manual runs are a check only unless "Really deploy" is ticked: they build, run the tests and prove that the
# SSH login and the target folder work, but change nothing on the server.
# The daily run (07:00 JST, after the 06:10 data collection) and every push to main that touches the site or collector
# code deploy for real (the unit tests are the gate). A failed check rolls the site back
# and fails the run, which GitHub reports to the owner by e-mail. First real run checked by the owner: 2026-10-05.

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST
  push:                      # a push of site or collector code deploys for real (no manual click needed)
    branches: [main]
    paths:
      - "sites/**"
      - "sokuhou/**"
      - "data/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Really deploy (otherwise check only)"
        type: boolean
        default: false
      only:
        description: "Only this site (a name from data/sites.json); empty = every site (kuma-live.yml uses it after each data collection)"
        type: string
        default: ""
      live_only:
        description: "Only run the full live check of the sites' real pages (read-only: no build, no tests, no SSH, nothing is changed); measures the check without a deploy"
        type: boolean
        default: false
      attempt:
        description: "Set by the workflow itself: the number of the try when a site is started again because the server did not answer (1, 2, 3)"
        type: string
        default: "1"

permissions:
  contents: read

env:
  SSH_PORT: "10022"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the plan compares with the commit each live site was built from
      - name: Plan (which sites have something to publish; the reasons are in the run summary)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ONLY: ${{ github.event.inputs.only }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          # atomou is a DEMO until ATOMOU_PUBLIC is "true"; while ATOMOU_REVIEW is "true" and ATOMOU_PUBLIC is not, the small review copy is the site
          ATOMOU_BUILD_FLAG: ${{ vars.ATOMOU_PUBLIC == 'true' && '--release' || (vars.ATOMOU_REVIEW == 'true' && '--review' || '') }}
          ATOMOU_PROBE: ${{ vars.ATOMOU_PUBLIC != 'true' && vars.ATOMOU_REVIEW == 'true' && '/c/exams/' || '/assets/catalog.json' }}
        run: python3 -m sokuhou.deployplan plan

  deploy:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      actions: write   # only to start this site again on another runner when the server did not answer (the last step)
    strategy:
      fail-fast: false
      max-parallel: 10   # a wave of many sites (a change to something shared) does not take all 20 runners of the repository, nor open dozens of SSH connections at once
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      # sites that call the Rakuten API share one queue (one application ID, about one request per second), so two such jobs never run at once
      group: ${{ matrix.group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the unit tests run in a second work tree of this checkout (see "Unit tests" below)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Gate (secrets, and the kuma switch)
        id: gate
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          KUMA: ${{ vars.DEPLOY_KUMA }}
          YOROKOBU: ${{ vars.DEPLOY_YOROKOBU }}
          MINNA: ${{ vars.DEPLOY_MINNA }}
          ATOMOU: ${{ vars.DEPLOY_ATOMOU }}
          ATOMOU_PUBLIC: ${{ vars.ATOMOU_PUBLIC }}
          ATOMOU_REVIEW: ${{ vars.ATOMOU_REVIEW }}
          DEMO_USER: ${{ secrets.ATOMOU_DEMO_USER || 'demo' }}
          DEMO_PASS: ${{ secrets.ATOMOU_DEMO_PASSWORD }}
          RK_APP: ${{ secrets.RAKUTEN_APP_ID }}
          RK_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          SITE: ${{ matrix.site }}
          FAST: ${{ matrix.fast }}
          LIVE_ONLY: ${{ inputs.live_only }}
          EVENT: ${{ github.event_name }}
          DEPLOY_INPUT: ${{ inputs.deploy }}
          CHECK_ONLY: ${{ vars.DEPLOY_CHECK_ONLY }}
        run: |
          # Which sites have something to publish was decided by the plan job (sokuhou/deployplan.py): this job exists because its site has.  What is left here is whether the
          # secrets and switches allow it.
          go=true
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER_ID" ]; then
            echo "XSERVER_SSH_KEY / XSERVER_HOST / XSERVER_USER are not all set; nothing to do"
            go=false
          fi
          if [ "$SITE" = "kuma" ] && [ "$KUMA" != "true" ]; then
            echo "DEPLOY_KUMA is not true; the kuma site is skipped"
            go=false
          fi
          if [ "$SITE" = "yorokobu" ] && { [ "$YOROKOBU" != "true" ] || [ -z "$RK_APP" ] || [ -z "$RK_KEY" ]; }; then
            echo "DEPLOY_YOROKOBU is not true, or the Rakuten secrets are missing; the yorokobu site is skipped"
            go=false
          fi
          if [ "$SITE" = "minna" ] && [ "$MINNA" != "true" ]; then
            echo "DEPLOY_MINNA is not true; the minna site is skipped"
            go=false
          fi
          if [ "$SITE" = "atomou" ] && [ "$ATOMOU" != "true" ]; then
            echo "DEPLOY_ATOMOU is not true; the atomou site is skipped"
            go=false
          fi
          if [ "$SITE" = "atomou" ] && [ "$ATOMOU_PUBLIC" != "true" ] && { [ -z "$DEMO_USER" ] || [ -z "$DEMO_PASS" ]; }; then
            echo "atomou is still a demo and ATOMOU_DEMO_USER / ATOMOU_DEMO_PASSWORD are not set: it is not deployed unprotected; the atomou site is skipped"
            go=false
          fi
          # Does this run change the server?  A manual run only when "Really deploy" is ticked; a push or the daily run always, unless the repository variable DEPLOY_CHECK_ONLY is "true"
          # (the pause switch: the runs build, test and prove the SSH login, but publish nothing; a manual run with "Really deploy" still publishes, so a site can be tried by hand)
          really=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$DEPLOY_INPUT" = "true" ] && really=true
          elif [ "$CHECK_ONLY" != "true" ]; then
            really=true
          fi
          live=false
          if [ "$LIVE_ONLY" = "true" ]; then
            echo "live_only: only the live check of the real pages runs"
            live=true
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "fast=$FAST" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "really=$really" >> "$GITHUB_OUTPUT"
          if [ "$really" != "true" ] && [ "$go" = "true" ]; then echo "CHECK ONLY: nothing on the server will be changed by this run"; fi
      - name: Live check only (read-only, the real pages of the live site are fetched and checked, nothing is built, tested or changed)
        if: steps.gate.outputs.live == 'true' && matrix.site != 'atomou'
        run: python -m sokuhou.sitecheck --live --base ${{ matrix.url }} --probe "${{ matrix.probe }}"
      - name: Fonts and Pillow for the share cards, and the PDF reader
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet pillow -r requirements.txt
      - name: SSH setup (first thing, before the long steps, a server that does not answer from this runner is found in about a minute, not after the tests)
        id: ssh
        if: steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE: ${{ matrix.site }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          sleep $((RANDOM % 8))   # a wave of sites does not knock on the server in the same second (it drops simultaneous connections); no fixed per-site wait any more (it was 0 to 160 s)
          # one connection for the whole job (ControlMaster): every later ssh and tar of this job reuses it; a host key that is not known yet is accepted on first contact
          printf '%s\n' 'Host *' '  ConnectionAttempts 2' '  ConnectTimeout 10' '  StrictHostKeyChecking accept-new' '  ServerAliveInterval 15' '  ServerAliveCountMax 4' \
            '  ControlMaster auto' '  ControlPath ~/.ssh/cm-%C' '  ControlPersist 30m' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          reached=0
          for try in 1 2 3; do   # about 75 seconds at most; a longer blackout of this runner (15 minutes, seen on 2026-10-17) is not waited for: this site starts again on another runner (last step)
            if ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" true 2> /tmp/ssh.err; then reached=1; break; fi
            echo "server not reachable (attempt $try): $(head -c 160 /tmp/ssh.err | tr -s '[:space:]' ' ')"
            sleep $((try * 5))
          done
          if [ "$reached" != 1 ]; then
            echo "unreachable=true" >> "$GITHUB_OUTPUT"
            # diagnostics for later (which address this runner has, whether other ports of the server answer): nothing secret, the host name is masked in the log
            addr=$(curl -s --max-time 5 https://api.ipify.org || echo unknown)
            echo "runner address: $addr"
            row="| $(date -u +%FT%TZ) | $SITE | $addr |"
            for port in "$SSH_PORT" 443 21 990; do   # 22 is closed on this server in any case; 21 and 990 (FTP, FTPS) are the only other way in, should SSH stay cut off
              if timeout 5 bash -c "exec 3<>/dev/tcp/$HOST/$port" 2> /dev/null; then echo "tcp port $port: answers"; row="$row $port yes |"; else echo "tcp port $port: no answer"; row="$row $port no |"; fi
            done
            echo "REACH $row"
            echo "$row" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Private mall data (Rakuten / Yahoo! results, taken from the server's private folder; they are never in the repository - see sites/yorokobu/privatedata.py)
        if: steps.gate.outputs.go == 'true' && matrix.site == 'yorokobu'
        env:
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
        run: python -m sites.yorokobu.privatedata pull
      - name: Unit tests, started now and read later (skipped in the fast lane, because the committing session ran them and the daily full deploy runs them again)
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.fast != 'true'
        env:
          SITE: ${{ matrix.site }}
        run: |
          # The tests run beside the build and the checks below, in a second work tree of this checkout (git worktree + the git-ignored files already here, e.g. yorokobu's private data),
          # so that nothing they write (out/, caches, release/) meets what the build reads.  The step "Unit tests result" waits for them and stops the job if they failed, before the server is touched.
          T="$RUNNER_TEMP/testtree"
          git worktree add --detach "$T" HEAD > /dev/null
          git ls-files -z --others --ignored --exclude-standard | grep -zv -e '^out/' -e '^release/' -e '^demo_build/' -e '__pycache__' | xargs -0 -r cp --parents -t "$T"
          cd "$T"
          rm -f "$RUNNER_TEMP/tests.rc"
          setsid nohup bash -c 'CI=true python tests/run_tests.py --strict --site "$0"; echo $? > "$1/tests.rc"' "$SITE" "$RUNNER_TEMP" > "$RUNNER_TEMP/tests.log" 2>&1 < /dev/null &
          echo "unit tests started in $T"   # the shared tests and this site's own; another project's failing tests cannot block this deploy
      - name: Fetch products (yorokobu-items.yml fetches them every day and keeps them in the server's private folder, which the step 'Private mall data' above has pulled; this adds only the day's editorial difference, a few API calls; without a fresh file it fetches everything, which takes about 40 minutes)
        if: steps.gate.outputs.go == 'true' && matrix.site == 'yorokobu'
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          mkdir -p out
          python -m sites.yorokobu.items_fresh || python -m sites.yorokobu.refresh --out out/yorokobu_items.json
      - name: Build (release)
        if: steps.gate.outputs.go == 'true'
        env:
          BUILD: ${{ matrix.build }}
          MIN_PAGES: ${{ matrix.min_pages }}
          MIN_CARDS: ${{ matrix.min_cards }}
        run: |
          $BUILD
          test -f release/index.html
          test -f release/.htaccess
          test "$(find release -name '*.html' | wc -l)" -ge "$MIN_PAGES"
          if [ "$MIN_CARDS" -gt 0 ]; then test "$(ls release/og | wc -l)" -ge "$MIN_CARDS"; fi   # share cards were drawn (the CJK font was found)
          echo "$GITHUB_SHA" > release/deployed-sha.txt   # the next push's gate reads it from the live site (see the Gate step); a public commit id of this public repository
          du -sh release
      - name: Natural-wording dictionary (styleloop - the rewordings of data/style/rewrites/SITE.json, checked again now and applied to the built text; FAIL-OPEN, so a problem is only a warning and the page keeps its own text; the checks below run on the result)
        if: steps.gate.outputs.go == 'true'
        run: python -m sokuhou.styleloop apply release --site ${{ matrix.site }} --fail-open
      - name: Site check (every link, the sitemap, headings, tables, empty sections of the REAL build; a problem stops the deploy)
        if: steps.gate.outputs.go == 'true'
        run: python -m sokuhou.sitecheck release --base ${{ matrix.url }}
      - name: Phone-width layout check (Chrome measures sample pages of every kind at 300 / 375 / 768 px; sideways overflow or squeezed text stops the deploy)
        if: steps.gate.outputs.go == 'true'
        run: python -m sokuhou.layoutcheck release
      - name: IndexNow key file (the search engines fetch it to check that we own the site; public by design)
        if: steps.gate.outputs.go == 'true' && matrix.site != 'atomou'
        run: python -m sokuhou.indexnow prepare --root release --base ${{ matrix.url }}
      - name: Hidden demo for atomou (review copy only; the full demo goes to public_html/demo, the folder of demo.atomou.com, behind its password)
        if: steps.gate.outputs.go == 'true' && matrix.site == 'atomou' && vars.ATOMOU_PUBLIC != 'true' && vars.ATOMOU_REVIEW == 'true'
        run: |
          set -euo pipefail
          python sites/atomou/build.py --demo-sub --out demo_build
          python -m sokuhou.sitecheck demo_build --base https://demo.atomou.com
          python -m sokuhou.layoutcheck demo_build
          test -f demo_build/.htaccess
          # the panel does not show a subdomain's document root: Xserver's default is public_html/<host name>, the owner's note says public_html/demo; both get the demo (both behind the password)
          for d in demo demo.atomou.com; do mkdir -p "release/$d"; cp -a demo_build/. "release/$d/"; done
      - name: Check the server (read only)
        id: servercheck
        if: steps.gate.outputs.go == 'true'
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
        run: |
          # also what the server has to say about itself, for the limits of a server with many sites (disk, files, rsync): printed, never a reason to fail
          rc=0
          for try in 1 2 3; do
            rc=0
            ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" \
              "set -e; cd \"\$HOME/$SITE_DIR\"; pwd; test -d public_html; command -v tar >/dev/null; ls -d public_html*; (df -h \"\$HOME\" | tail -n 1; df -i \"\$HOME\" | tail -n 1; du -sh public_html .deploy_prev 2>/dev/null; command -v rsync || echo 'rsync: none') || true" && break || rc=$?
            [ "$rc" = 255 ] || break   # 255 is ssh's own: no connection; anything else is the server's answer (a missing folder) and a second try would say the same
            echo "server not reachable (attempt $try)"
            sleep $((try * 5))
          done
          if [ "$rc" != 0 ]; then
            [ "$rc" = 255 ] && echo "unreachable=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Unit tests result (the tests started above ran beside the build; a failure stops the job here, before the server is changed)
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.fast != 'true'
        run: |
          waited=0
          while [ ! -f "$RUNNER_TEMP/tests.rc" ]; do
            sleep 5
            waited=$((waited + 5))
            if [ "$waited" -gt 3000 ]; then echo "the unit tests did not finish in 50 minutes after the build"; tail -n 40 "$RUNNER_TEMP/tests.log"; exit 1; fi
          done
          echo "the tests finished $waited seconds after the build and its checks"
          cat "$RUNNER_TEMP/tests.log"
          [ "$(cat "$RUNNER_TEMP/tests.rc")" = 0 ]
      - name: Demo password file for atomou (outside public_html; the preview build asks for it)
        if: steps.gate.outputs.go == 'true' && matrix.site == 'atomou' && vars.ATOMOU_PUBLIC != 'true' && steps.gate.outputs.really == 'true'
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
          DEMO_USER: ${{ secrets.ATOMOU_DEMO_USER || 'demo' }}
          DEMO_PASS: ${{ secrets.ATOMOU_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          home=$(ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" 'printf %s "$HOME"')
          test -n "$home"
          printf '%s:%s\n' "$DEMO_USER" "$(openssl passwd -apr1 "$DEMO_PASS")" | ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" \
            "set -e; cd \"\$HOME/$SITE_DIR\"; cat > .htpasswd; chmod 604 .htpasswd"
          for f in release/.htaccess release/demo/.htaccess release/demo.atomou.com/.htaccess; do   # the demo itself, or (review copy) the hidden demo folder
            if [ -f "$f" ] && grep -q __HTPASSWD__ "$f"; then
              sed -i "s#__HTPASSWD__#$home/$SITE_DIR/.htpasswd#" "$f"
              grep -q "AuthUserFile $home/$SITE_DIR/.htpasswd" "$f"
            fi
          done
          for d in release/demo release/demo.atomou.com; do if [ -d "$d" ]; then grep -q "AuthUserFile" "$d/.htaccess"; fi; done
      - name: IndexNow previous sitemap (the live one, kept before the new build replaces it; a failure only means nothing is sent afterwards)
        if: steps.gate.outputs.go == 'true' && matrix.site != 'atomou' && steps.gate.outputs.really == 'true'
        continue-on-error: true
        run: python -m sokuhou.indexnow snapshot --base ${{ matrix.url }} --out prev_sitemap.xml
      - name: Private product data for api/items.php (the favourites, shared lists, gacha and answer pages ask it for a few products at a time; the files are never public, they stay in the server's private folder)
        if: steps.gate.outputs.go == 'true' && matrix.site == 'yorokobu' && steps.gate.outputs.really == 'true'
        env:
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
        run: python -m sites.yorokobu.privatedata push yorokobu_items_db.json yorokobu_gacha_db.json yorokobu_rec_db.json
      - name: Upload and switch
        id: upload
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.really == 'true'
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          rc=0
          tar -C release -czf - . | ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" "
            set -e
            cd \"\$HOME/$SITE_DIR\"
            rm -rf .deploy_next
            mkdir .deploy_next
            tar -xzf - -C .deploy_next
            test -f .deploy_next/index.html
            test -f .deploy_next/.htaccess
            # atomou's live file (made every 10 minutes by atomou-live.yml) is not part of the build: it is carried over, so a deploy does not leave the app without it
            for d in live demo/live demo.atomou.com/live; do
              if [ -d \"public_html/\$d\" ]; then mkdir -p \".deploy_next/\$(dirname \$d)\"; cp -a \"public_html/\$d\" \".deploy_next/\$d\"; fi
            done
            rm -rf .deploy_prev
            mv public_html .deploy_prev
            mv .deploy_next public_html
          " || rc=$?
          if [ "$rc" != 0 ]; then
            # 255 is ssh's own: the connection was lost.  The switch is the last command of the script, so a lost connection leaves the live site as it was (only .deploy_next is half written)
            [ "$rc" = 255 ] && echo "unreachable=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Verify the live site, roll back if it is wrong
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.really == 'true'
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
          URL: ${{ matrix.url }}
          MARKER: ${{ matrix.marker }}
          MIN_PAGES: ${{ matrix.min_pages }}
          PROBE: ${{ matrix.probe }}
          SITE: ${{ matrix.site }}
          FAST: ${{ steps.gate.outputs.fast }}
          ATOMOU_PUBLIC: ${{ vars.ATOMOU_PUBLIC }}
          ATOMOU_REVIEW: ${{ vars.ATOMOU_REVIEW }}
          DEMO_USER: ${{ secrets.ATOMOU_DEMO_USER || 'demo' }}
          DEMO_PASS: ${{ secrets.ATOMOU_DEMO_PASSWORD }}
        run: |
          set -u
          ok=1
          AUTH=()
          if [ "$SITE" = "atomou" ] && [ "${ATOMOU_PUBLIC:-}" != "true" ] && [ "${ATOMOU_REVIEW:-}" != "true" ]; then
            AUTH=(-u "$DEMO_USER:$DEMO_PASS")   # the demo is behind a password: it must refuse a visitor without it and answer one with it
            unauth=$(curl -s -o /dev/null -w '%{http_code}' "$URL/"); echo "without the password: $unauth (must be 401)"
            [ "$unauth" = "401" ] || ok=0
          fi
          if [ "$SITE" = "atomou" ] && [ "${ATOMOU_PUBLIC:-}" != "true" ] && [ "${ATOMOU_REVIEW:-}" = "true" ]; then
            for p in /demo/ /demo.atomou.com/; do
              hidden=$(curl -s -o /dev/null -w '%{http_code}' "$URL$p"); echo "the hidden demo folder $p without the password: $hidden (must be 401)"
              [ "$hidden" = "401" ] || ok=0
            done
            sub=$(curl -s -o /dev/null -w '%{http_code}' https://demo.atomou.com/) || sub=none; echo "demo.atomou.com itself: $sub (401 = the subdomain reaches the demo; 404 = its document root is somewhere else)"
          fi
          code=$(curl -s "${AUTH[@]}" -o /tmp/index.html -w '%{http_code}' "$URL/") || ok=0
          [ "$code" = "200" ] || ok=0
          grep -q "$MARKER" /tmp/index.html || { echo "the page lacks the marker text"; ok=0; }
          urls=$(curl -s "${AUTH[@]}" "$URL/sitemap.xml" | grep -c '<loc>') || ok=0
          [ "${urls:-0}" -ge "$((MIN_PAGES - 5))" ] || ok=0
          probe=$(curl -s "${AUTH[@]}" -o /dev/null -w '%{http_code}' "$URL$PROBE"); echo "probe $PROBE: $probe (must be 200)"
          [ "$probe" = "200" ] || ok=0
          echo "index=$code sitemap_urls=${urls:-0} ok=$ok"
          # every sitemap URL answers 200 and obeys the page rules, and every internal link on them answers 200 (checked twice before the site is rolled back, so a network blip does not undo a good deploy)
          if [ "${#AUTH[@]}" -gt 0 ]; then
            if [ "$ok" = "1" ]; then echo "demo behind a password: the full live check is skipped (it cannot log in); the checks above passed"; fi
          elif [ "$ok" = "1" ]; then
            LIGHT=()
            if [ "${FAST:-}" = "true" ]; then LIGHT=(--sample 150 --prev prev_sitemap.xml); fi   # fast lane: the home page, the new pages and 150 random ones (the real build was checked page by page; the daily full deploy checks every page live)
            if ! python -m sokuhou.sitecheck --live --base "$URL" --probe "$PROBE" "${LIGHT[@]}"; then
              echo "live check failed; trying once more in 30 s"
              sleep 30
              python -m sokuhou.sitecheck --live --base "$URL" --probe "$PROBE" "${LIGHT[@]}" || ok=0
            fi
          fi
          if [ "$ok" != "1" ]; then
            echo "verification failed, rolling back"
            if [ "$SITE" = "atomou" ]; then   # why: the web server's error log and the password file's permissions (not its content)
              ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" "
                cd \"\$HOME/$SITE_DIR\" && ls -la .htpasswd && ls -d log* 2>/dev/null; grep -hn 'Auth\|Require' public_html/.htaccess | sed 's#/home/[^/]*/#/home/…/#';
                for f in log/error_log* ../logs/*error* log/*error*; do [ -f \"\$f\" ] && { echo \"== \$f\"; tail -n 8 \"\$f\" | cut -c1-300; }; done; true
              " || true
            fi
            ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" "
              set -e
              cd \"\$HOME/$SITE_DIR\"
              test -d .deploy_prev
              mv public_html .deploy_failed
              mv .deploy_prev public_html
              rm -rf .deploy_failed
            "
            exit 1
          fi
      - name: How long the change waited (written to the run summary - the time from the oldest change this deploy publishes to the site being live and checked)
        if: steps.gate.outputs.go == 'true' && steps.gate.outputs.really == 'true'
        env:
          SINCE: ${{ matrix.since }}
          SITE: ${{ matrix.site }}
        run: |
          now=$(date +%s)
          if [ "${SINCE:-0}" -gt 0 ]; then
            echo "- **$SITE is live $(( (now - SINCE) / 60 )) minutes after its oldest waiting change was committed**" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "- $SITE is live (a manual or daily run: no waiting change to measure)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: IndexNow submit (tells Bing and the other IndexNow engines which pages are new or changed; it never fails or rolls back a deploy)
        if: steps.gate.outputs.go == 'true' && matrix.site != 'atomou' && steps.gate.outputs.really == 'true'
        continue-on-error: true
        run: python -m sokuhou.indexnow submit --root release --base ${{ matrix.url }} --prev prev_sitemap.xml
      - name: Start this site again on another runner (the server did not answer from this one - on 2026-10-17 a runner was cut off for about 15 minutes while other runners were connected; a new job is a new runner)
        if: failure() && (steps.ssh.outputs.unreachable == 'true' || steps.servercheck.outputs.unreachable == 'true' || steps.upload.outputs.unreachable == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ matrix.site }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
          REALLY: ${{ steps.gate.outputs.really }}
        run: |
          # the new run is a manual run of this site only; it compares nothing with a push, it builds the newest main.  At most 3 tries; after that the hourly watchdog (office-watch) takes over.
          if [ "$ATTEMPT" -ge 3 ]; then echo "this was try $ATTEMPT: not starting again; the watchdog will"; exit 0; fi
          sleep 90
          gh workflow run deploy.yml --ref "$GITHUB_REF_NAME" -f only="$SITE" -f deploy="$REALLY" -f attempt="$((ATTEMPT + 1))"
          echo "started $SITE again (try $((ATTEMPT + 1)))"
