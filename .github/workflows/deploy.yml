name: deploy-sites

# Builds each site and uploads it to Xserver over SSH (one job per site).
# Needs three repository secrets, all created by the owner (never by Claude):
#   XSERVER_SSH_KEY   the private key file from Xserver's SSH settings (whole file, passphrase-free)
#   XSERVER_HOST      e.g. sv8477.xserver.jp
#   XSERVER_USER      the Xserver server ID (the SSH user name)
# The kuma site is built and uploaded only when the repository variable DEPLOY_KUMA is "true" (set after the
# owner has added kuma-sokuho.com to the Xserver server); the same switch for minna-no-illust.com is DEPLOY_MINNA and for atomou.com DEPLOY_ATOMOU.
# atomou is a DEMO until the repository variable ATOMOU_PUBLIC is "true" (release build, indexable). While it is a demo it is deployed only
# behind a password (HTTP Basic): the secret ATOMOU_DEMO_PASSWORD (owner-made) must exist (the user name is ATOMOU_DEMO_USER, "demo" when that secret is not set), the job writes the password
# file to ~/atomou.com/.htpasswd (outside public_html) and the preview build's .htaccess asks for it. Without them nothing is deployed.
#
# Manual runs are a check only unless "Really deploy" is ticked: they build, run the tests and prove that the
# SSH login and the target folder work, but change nothing on the server.
# The daily run (07:00 JST, after the 06:10 data collection) and every push to main that touches the site or collector
# code deploy for real (the unit tests are the gate). A failed check rolls the site back
# and fails the run, which GitHub reports to the owner by e-mail. First real run checked by the owner: 2026-10-05.

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST
  push:                      # a push of site or collector code deploys for real (no manual click needed)
    branches: [main]
    paths:
      - "sites/**"
      - "sokuhou/**"
      - "data/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Really deploy (otherwise check only)"
        type: boolean
        default: false
      only:
        description: "Only this site (saichin, kuma, yorokobu, minna, atomou); empty = every site (kuma-live.yml uses it after each data collection)"
        type: string
        default: ""

permissions:
  contents: read

env:
  SSH_PORT: "10022"

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: saichin
            dir: saichin-sokuho.com
            url: https://saichin-sokuho.com
            build: python sites/saichin/build.py --release --out release
            min_pages: 70
            min_cards: 48
            marker: 最低賃金速報
            probe: /calendar/all.ics
          - site: kuma
            dir: kuma-sokuho.com
            url: https://kuma-sokuho.com
            build: python sites/kuma/build.py --release --out release
            min_pages: 100
            min_cards: 0
            marker: クマ出没速報
            probe: /feed.xml
          - site: yorokobu
            dir: yorokobu-present.com
            url: https://yorokobu-present.com
            build: python sites/yorokobu/build.py --release --out release --items out/yorokobu_items.json
            min_pages: 120
            min_cards: 0
            marker: よろこぶプレゼント
            probe: /sitemap.xml
          - site: minna
            dir: minna-no-illust.com
            url: https://minna-no-illust.com
            build: python sites/minna/build.py --release --out release
            min_pages: 90
            min_cards: 0
            marker: みんなのイラスト
            probe: /sitemap-images.xml
          - site: atomou
            dir: atomou.com
            url: https://atomou.com
            build: python sites/atomou/build.py ${{ vars.ATOMOU_PUBLIC == 'true' && '--release' || '' }} --out release
            min_pages: 60
            min_cards: 0
            marker: あと何日、もう何日
            probe: /assets/catalog.json
    concurrency:
      # sites that call the Rakuten API share one queue (one application ID, about one request per second), so two such jobs never run at once
      group: ${{ matrix.site == 'yorokobu' && 'rakuten-api' || format('deploy-{0}', matrix.site) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the gate below looks at which files a push changed
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Gate (secrets, and the kuma switch)
        id: gate
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          KUMA: ${{ vars.DEPLOY_KUMA }}
          YOROKOBU: ${{ vars.DEPLOY_YOROKOBU }}
          MINNA: ${{ vars.DEPLOY_MINNA }}
          ATOMOU: ${{ vars.DEPLOY_ATOMOU }}
          ATOMOU_PUBLIC: ${{ vars.ATOMOU_PUBLIC }}
          DEMO_USER: ${{ secrets.ATOMOU_DEMO_USER || 'demo' }}
          DEMO_PASS: ${{ secrets.ATOMOU_DEMO_PASSWORD }}
          RK_APP: ${{ secrets.RAKUTEN_APP_ID }}
          RK_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          SITE: ${{ matrix.site }}
          EVENT: ${{ github.event_name }}
          ONLY: ${{ github.event.inputs.only }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          go=true
          if [ -n "$ONLY" ] && [ "$ONLY" != "$SITE" ]; then
            echo "this run is for $ONLY only; $SITE is skipped"
            go=false
          fi
          # A push that only touches another site's own files (sites/yorokobu, sites/minna and their tests) does not redeploy this site.
          # Anything shared (the collector, kit, workflows, data, other tests) redeploys every site; on any doubt the site is deployed.
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            if files=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null) && [ -n "$files" ]; then
              relevant=0
              while IFS= read -r f; do
                case "$f" in
                  sites/yorokobu/*|tests/test_yorokobu*|tests/fixtures/yorokobu/*|data/yorokobu*) owner=yorokobu ;;
                  sites/minna/*|tests/test_minna*) owner=minna ;;
                  sites/atomou/*|tests/test_atomou*|tests/fixtures/atomou/*|data/atomou/*) owner=atomou ;;
                  sites/kuma/*|tests/test_kuma*|tests/test_*_kuma.py|tests/test_otsu_bear.py|tests/fixtures/*kuma*|tests/fixtures/otsu_bear*|data/*_kuma.json|data/otsu_bear.json|sokuhou/sources/*_kuma.py|sokuhou/sources/otsu_bear.py) owner=kuma ;;
                  *) owner=shared ;;
                esac
                if [ "$owner" = "shared" ] || [ "$owner" = "$SITE" ]; then relevant=1; fi
              done <<< "$files"
              if [ "$relevant" = "0" ]; then
                echo "this push only changed other sites' files; $SITE is skipped"
                go=false
              fi
            fi
          fi
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER_ID" ]; then
            echo "XSERVER_SSH_KEY / XSERVER_HOST / XSERVER_USER are not all set; nothing to do"
            go=false
          fi
          if [ "$SITE" = "kuma" ] && [ "$KUMA" != "true" ]; then
            echo "DEPLOY_KUMA is not true; the kuma site is skipped"
            go=false
          fi
          if [ "$SITE" = "yorokobu" ] && { [ "$YOROKOBU" != "true" ] || [ -z "$RK_APP" ] || [ -z "$RK_KEY" ]; }; then
            echo "DEPLOY_YOROKOBU is not true, or the Rakuten secrets are missing; the yorokobu site is skipped"
            go=false
          fi
          if [ "$SITE" = "minna" ] && [ "$MINNA" != "true" ]; then
            echo "DEPLOY_MINNA is not true; the minna site is skipped"
            go=false
          fi
          if [ "$SITE" = "atomou" ] && [ "$ATOMOU" != "true" ]; then
            echo "DEPLOY_ATOMOU is not true; the atomou site is skipped"
            go=false
          fi
          if [ "$SITE" = "atomou" ] && [ "$ATOMOU_PUBLIC" != "true" ] && { [ -z "$DEMO_USER" ] || [ -z "$DEMO_PASS" ]; }; then
            echo "atomou is still a demo and ATOMOU_DEMO_USER / ATOMOU_DEMO_PASSWORD are not set: it is not deployed unprotected; the atomou site is skipped"
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - name: Fonts and Pillow for the share cards, and the PDF reader
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet pillow -r requirements.txt
      - name: Unit tests
        if: steps.gate.outputs.go == 'true'
        run: CI=true python tests/run_tests.py --strict --site ${{ matrix.site }}   # the shared tests and this site's own; another project's failing tests cannot block this deploy
      - name: Today's date (the products are fetched once a day and cached, so a code push does not refetch)
        if: steps.gate.outputs.go == 'true' && matrix.site == 'yorokobu'
        run: echo "DAY=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"
      - name: Restore today's products
        if: steps.gate.outputs.go == 'true' && matrix.site == 'yorokobu'
        id: items-cache
        uses: actions/cache@v4
        with:
          path: out/yorokobu_items.json
          # the key changes with the day and with the editorial files that decide which products are fetched, so new picks, themes and ideas show up on the next deploy
          key: yorokobu-items-v3-${{ env.DAY }}-${{ hashFiles('sites/yorokobu/content/picks.json', 'sites/yorokobu/content/themes.json', 'sites/yorokobu/content/ideas.json') }}
      - name: Fetch products
        if: steps.gate.outputs.go == 'true' && matrix.site == 'yorokobu' && steps.items-cache.outputs.cache-hit != 'true'
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          if [ -f sites/yorokobu/content/picks.json ]; then
            python -m sites.yorokobu.refresh --out out/yorokobu_items.json
          else
            python -m sites.yorokobu.fetch --out out/yorokobu_items.json
          fi
      - name: Build (release)
        if: steps.gate.outputs.go == 'true'
        env:
          BUILD: ${{ matrix.build }}
          MIN_PAGES: ${{ matrix.min_pages }}
          MIN_CARDS: ${{ matrix.min_cards }}
        run: |
          $BUILD
          test -f release/index.html
          test -f release/.htaccess
          test "$(find release -name '*.html' | wc -l)" -ge "$MIN_PAGES"
          if [ "$MIN_CARDS" -gt 0 ]; then test "$(ls release/og | wc -l)" -ge "$MIN_CARDS"; fi   # share cards were drawn (the CJK font was found)
          du -sh release
      - name: Site check (every link, the sitemap, headings, tables, empty sections of the REAL build; a problem stops the deploy)
        if: steps.gate.outputs.go == 'true'
        run: python -m sokuhou.sitecheck release --base ${{ matrix.url }}
      - name: Phone-width layout check (Chrome measures sample pages of every kind at 300 / 375 / 768 px; sideways overflow or squeezed text stops the deploy)
        if: steps.gate.outputs.go == 'true'
        run: python -m sokuhou.layoutcheck release
      - name: SSH setup
        if: steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          sleep $((RANDOM % 25))   # the four site jobs start together; the server drops some simultaneous connections, so spread them out
          for try in 1 2 3 4 5 6; do   # the key scan sometimes comes back empty for a moment
            ssh-keyscan -T 10 -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts 2> /tmp/keyscan.err || true
            [ -s ~/.ssh/known_hosts ] && break
            echo "key scan attempt $try returned nothing: $(head -c 200 /tmp/keyscan.err | tr -s '[:space:]' ' ')"
            sleep $((try * 10))
          done
          test -s ~/.ssh/known_hosts
      - name: Check the server (read only)
        if: steps.gate.outputs.go == 'true'
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
        run: |
          ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" \
            "set -e; cd \"\$HOME/$SITE_DIR\"; pwd; test -d public_html; command -v tar >/dev/null; ls -d public_html*"
      - name: Demo password file for atomou (outside public_html; the preview build asks for it)
        if: steps.gate.outputs.go == 'true' && matrix.site == 'atomou' && vars.ATOMOU_PUBLIC != 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
          DEMO_USER: ${{ secrets.ATOMOU_DEMO_USER || 'demo' }}
          DEMO_PASS: ${{ secrets.ATOMOU_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          home=$(ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" 'printf %s "$HOME"')
          test -n "$home"
          printf '%s:%s\n' "$DEMO_USER" "$(openssl passwd -apr1 "$DEMO_PASS")" | ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" \
            "set -e; cd \"\$HOME/$SITE_DIR\"; cat > .htpasswd; chmod 604 .htpasswd"
          sed -i "s#__HTPASSWD__#$home/$SITE_DIR/.htpasswd#" release/.htaccess
          grep -q "AuthUserFile $home/$SITE_DIR/.htpasswd" release/.htaccess
      - name: Upload and switch
        if: steps.gate.outputs.go == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          tar -C release -czf - . | ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" "
            set -e
            cd \"\$HOME/$SITE_DIR\"
            rm -rf .deploy_next
            mkdir .deploy_next
            tar -xzf - -C .deploy_next
            test -f .deploy_next/index.html
            test -f .deploy_next/.htaccess
            rm -rf .deploy_prev
            mv public_html .deploy_prev
            mv .deploy_next public_html
          "
      - name: Verify the live site, roll back if it is wrong
        if: steps.gate.outputs.go == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
          URL: ${{ matrix.url }}
          MARKER: ${{ matrix.marker }}
          MIN_PAGES: ${{ matrix.min_pages }}
          PROBE: ${{ matrix.probe }}
          SITE: ${{ matrix.site }}
          ATOMOU_PUBLIC: ${{ vars.ATOMOU_PUBLIC }}
          DEMO_USER: ${{ secrets.ATOMOU_DEMO_USER || 'demo' }}
          DEMO_PASS: ${{ secrets.ATOMOU_DEMO_PASSWORD }}
        run: |
          set -u
          ok=1
          AUTH=()
          if [ "$SITE" = "atomou" ] && [ "${ATOMOU_PUBLIC:-}" != "true" ]; then
            AUTH=(-u "$DEMO_USER:$DEMO_PASS")   # the demo is behind a password: it must refuse a visitor without it and answer one with it
            unauth=$(curl -s -o /dev/null -w '%{http_code}' "$URL/"); echo "without the password: $unauth (must be 401)"
            [ "$unauth" = "401" ] || ok=0
          fi
          code=$(curl -s "${AUTH[@]}" -o /tmp/index.html -w '%{http_code}' "$URL/") || ok=0
          [ "$code" = "200" ] || ok=0
          grep -q "$MARKER" /tmp/index.html || { echo "the page lacks the marker text"; ok=0; }
          urls=$(curl -s "${AUTH[@]}" "$URL/sitemap.xml" | grep -c '<loc>') || ok=0
          [ "${urls:-0}" -ge "$((MIN_PAGES - 5))" ] || ok=0
          probe=$(curl -s "${AUTH[@]}" -o /dev/null -w '%{http_code}' "$URL$PROBE"); echo "probe $PROBE: $probe (must be 200)"
          [ "$probe" = "200" ] || ok=0
          echo "index=$code sitemap_urls=${urls:-0} ok=$ok"
          # every sitemap URL answers 200 and obeys the page rules, and every internal link on them answers 200 (checked twice before the site is rolled back, so a network blip does not undo a good deploy)
          if [ "${#AUTH[@]}" -gt 0 ]; then
            if [ "$ok" = "1" ]; then echo "demo behind a password: the full live check is skipped (it cannot log in); the checks above passed"; fi
          elif [ "$ok" = "1" ] && ! python -m sokuhou.sitecheck --live --base "$URL" --probe "$PROBE"; then
            echo "live check failed; trying once more in 30 s"
            sleep 30
            python -m sokuhou.sitecheck --live --base "$URL" --probe "$PROBE" || ok=0
          fi
          if [ "$ok" != "1" ]; then
            echo "verification failed, rolling back"
            if [ "$SITE" = "atomou" ]; then   # why: the web server's error log and the password file's permissions (not its content)
              ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" "
                cd \"\$HOME/$SITE_DIR\" && ls -la .htpasswd && ls -d log* 2>/dev/null; grep -hn 'Auth\|Require' public_html/.htaccess | sed 's#/home/[^/]*/#/home/…/#';
                for f in log/error_log* ../logs/*error* log/*error*; do [ -f \"\$f\" ] && { echo \"== \$f\"; tail -n 8 \"\$f\" | cut -c1-300; }; done; true
              " || true
            fi
            ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" "
              set -e
              cd \"\$HOME/$SITE_DIR\"
              test -d .deploy_prev
              mv public_html .deploy_failed
              mv .deploy_prev public_html
              rm -rf .deploy_failed
            "
            exit 1
          fi
