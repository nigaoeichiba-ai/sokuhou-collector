name: deploy-sites

# Builds each site and uploads it to Xserver over SSH (one job per site).
# Needs three repository secrets, all created by the owner (never by Claude):
#   XSERVER_SSH_KEY   the private key file from Xserver's SSH settings (whole file, passphrase-free)
#   XSERVER_HOST      e.g. sv8477.xserver.jp
#   XSERVER_USER      the Xserver server ID (the SSH user name)
# The kuma site is built and uploaded only when the repository variable DEPLOY_KUMA is "true" (set after the
# owner has added kuma-sokuho.com to the Xserver server); the same switch for minna-no-illust.com is DEPLOY_MINNA.
#
# Manual runs are a check only unless "Really deploy" is ticked: they build, run the tests and prove that the
# SSH login and the target folder work, but change nothing on the server.
# The daily run (07:00 JST, after the 06:10 data collection) and every push to main that touches the site or collector
# code deploy for real (the unit tests are the gate). A failed check rolls the site back
# and fails the run, which GitHub reports to the owner by e-mail. First real run checked by the owner: 2026-10-05.

on:
  schedule:
    - cron: "0 22 * * *"   # 07:00 JST
  push:                      # a push of site or collector code deploys for real (no manual click needed)
    branches: [main]
    paths:
      - "sites/**"
      - "sokuhou/**"
      - "data/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Really deploy (otherwise check only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  SSH_PORT: "10022"

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: saichin
            dir: saichin-sokuho.com
            url: https://saichin-sokuho.com
            build: python sites/saichin/build.py --release --out release
            min_pages: 70
            min_cards: 48
            marker: 最低賃金速報
            probe: /calendar/all.ics
          - site: kuma
            dir: kuma-sokuho.com
            url: https://kuma-sokuho.com
            build: python sites/kuma/build.py --release --out release
            min_pages: 55
            min_cards: 0
            marker: クマ出没速報
            probe: /feed.xml
          - site: yorokobu
            dir: yorokobu-present.com
            url: https://yorokobu-present.com
            build: python sites/yorokobu/build.py --release --out release --items out/yorokobu_items.json
            min_pages: 120
            min_cards: 0
            marker: よろこぶプレゼント
            probe: /sitemap.xml
          - site: minna
            dir: minna-no-illust.com
            url: https://minna-no-illust.com
            build: python sites/minna/build.py --release --out release
            min_pages: 90
            min_cards: 0
            marker: みんなのイラスト
            probe: /sitemap-images.xml
    concurrency:
      group: deploy-${{ matrix.site }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the gate below looks at which files a push changed
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Gate (secrets, and the kuma switch)
        id: gate
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          KUMA: ${{ vars.DEPLOY_KUMA }}
          YOROKOBU: ${{ vars.DEPLOY_YOROKOBU }}
          MINNA: ${{ vars.DEPLOY_MINNA }}
          RK_APP: ${{ secrets.RAKUTEN_APP_ID }}
          RK_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          SITE: ${{ matrix.site }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          go=true
          # A push that only touches another site's own files (sites/yorokobu, sites/minna and their tests) does not redeploy this site.
          # Anything shared (the collector, kit, workflows, data, other tests) redeploys every site; on any doubt the site is deployed.
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            if files=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null) && [ -n "$files" ]; then
              relevant=0
              while IFS= read -r f; do
                case "$f" in
                  sites/yorokobu/*|tests/test_yorokobu*|tests/fixtures/yorokobu/*|data/yorokobu*) owner=yorokobu ;;
                  sites/minna/*|tests/test_minna*) owner=minna ;;
                  *) owner=shared ;;
                esac
                if [ "$owner" = "shared" ] || [ "$owner" = "$SITE" ]; then relevant=1; fi
              done <<< "$files"
              if [ "$relevant" = "0" ]; then
                echo "this push only changed other sites' files; $SITE is skipped"
                go=false
              fi
            fi
          fi
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER_ID" ]; then
            echo "XSERVER_SSH_KEY / XSERVER_HOST / XSERVER_USER are not all set; nothing to do"
            go=false
          fi
          if [ "$SITE" = "kuma" ] && [ "$KUMA" != "true" ]; then
            echo "DEPLOY_KUMA is not true; the kuma site is skipped"
            go=false
          fi
          if [ "$SITE" = "yorokobu" ] && { [ "$YOROKOBU" != "true" ] || [ -z "$RK_APP" ] || [ -z "$RK_KEY" ]; }; then
            echo "DEPLOY_YOROKOBU is not true, or the Rakuten secrets are missing; the yorokobu site is skipped"
            go=false
          fi
          if [ "$SITE" = "minna" ] && [ "$MINNA" != "true" ]; then
            echo "DEPLOY_MINNA is not true; the minna site is skipped"
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - name: Fonts and Pillow for the share cards, and the PDF reader
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet pillow -r requirements.txt
      - name: Unit tests
        if: steps.gate.outputs.go == 'true'
        run: python tests/run_tests.py --site ${{ matrix.site }}   # the shared tests and this site's own; another project's failing tests cannot block this deploy
      - name: Today's date (the products are fetched once a day and cached, so a code push does not refetch)
        if: steps.gate.outputs.go == 'true' && matrix.site == 'yorokobu'
        run: echo "DAY=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"
      - name: Restore today's products
        if: steps.gate.outputs.go == 'true' && matrix.site == 'yorokobu'
        id: items-cache
        uses: actions/cache@v4
        with:
          path: out/yorokobu_items.json
          key: yorokobu-items-v3-${{ env.DAY }}
      - name: Fetch products
        if: steps.gate.outputs.go == 'true' && matrix.site == 'yorokobu' && steps.items-cache.outputs.cache-hit != 'true'
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          if [ -f sites/yorokobu/content/picks.json ]; then
            python -m sites.yorokobu.refresh --out out/yorokobu_items.json
          else
            python -m sites.yorokobu.fetch --out out/yorokobu_items.json
          fi
      - name: Build (release)
        if: steps.gate.outputs.go == 'true'
        env:
          BUILD: ${{ matrix.build }}
          MIN_PAGES: ${{ matrix.min_pages }}
          MIN_CARDS: ${{ matrix.min_cards }}
        run: |
          $BUILD
          test -f release/index.html
          test -f release/.htaccess
          test "$(find release -name '*.html' | wc -l)" -ge "$MIN_PAGES"
          if [ "$MIN_CARDS" -gt 0 ]; then test "$(ls release/og | wc -l)" -ge "$MIN_CARDS"; fi   # share cards were drawn (the CJK font was found)
          du -sh release
      - name: SSH setup
        if: steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keyscan -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Check the server (read only)
        if: steps.gate.outputs.go == 'true'
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
        run: |
          ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" \
            "set -e; cd \"\$HOME/$SITE_DIR\"; pwd; test -d public_html; command -v tar >/dev/null; ls -d public_html*"
      - name: Upload and switch
        if: steps.gate.outputs.go == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          tar -C release -czf - . | ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" "
            set -e
            cd \"\$HOME/$SITE_DIR\"
            rm -rf .deploy_next
            mkdir .deploy_next
            tar -xzf - -C .deploy_next
            test -f .deploy_next/index.html
            test -f .deploy_next/.htaccess
            rm -rf .deploy_prev
            mv public_html .deploy_prev
            mv .deploy_next public_html
          "
      - name: Verify the live site, roll back if it is wrong
        if: steps.gate.outputs.go == 'true' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
          SITE_DIR: ${{ matrix.dir }}
          URL: ${{ matrix.url }}
          MARKER: ${{ matrix.marker }}
          MIN_PAGES: ${{ matrix.min_pages }}
          PROBE: ${{ matrix.probe }}
        run: |
          set -u
          ok=1
          code=$(curl -s -o /tmp/index.html -w '%{http_code}' "$URL/") || ok=0
          [ "$code" = "200" ] || ok=0
          grep -q "$MARKER" /tmp/index.html || ok=0
          urls=$(curl -s "$URL/sitemap.xml" | grep -c '<loc>') || ok=0
          [ "${urls:-0}" -ge "$((MIN_PAGES - 5))" ] || ok=0
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL$PROBE")" = "200" ] || ok=0
          echo "index=$code sitemap_urls=${urls:-0} ok=$ok"
          if [ "$ok" != "1" ]; then
            echo "verification failed, rolling back"
            ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" "
              set -e
              cd \"\$HOME/$SITE_DIR\"
              test -d .deploy_prev
              mv public_html .deploy_failed
              mv .deploy_prev public_html
              rm -rf .deploy_failed
            "
            exit 1
          fi
