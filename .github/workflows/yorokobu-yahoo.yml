name: yorokobu-yahoo

# [2026-10-17: the result is no longer committed to the public repository (the Rakuten terms bar keeping API data where many people can read it): it goes to the server's private
# folder, sites/yorokobu/privatedata.py, and the deploy takes it from there.]
# Every day: the Yahoo!ショッピング search results (Shopping Web API v3 itemSearch, links made affiliate links by the API itself) of each kind of gift in
# sites/yorokobu/content/compare.json, written to data/yorokobu_yahoo.json for the Yahoo! tables of the pages under /compare/.  Nothing is committed (the file only goes to the private folder); that file; a commit
# made with the workflow token starts no other workflow, so the pages change at the next deploy.  Needs YAHOO_CLIENT_ID (never printed).
# Runs after yorokobu-compare (05:20 JST), because a table is shown only when both files are from about the same time.

on:
  schedule:
    - cron: "50 20 * * *"   # 05:50 JST: a minute or two, before the 07:00 deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yorokobu-yahoo
  cancel-in-progress: false

jobs:
  yahoo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fetch the kinds of gift
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: |
          if [ -z "$YAHOO_CLIENT_ID" ]; then
            echo "YAHOO_CLIENT_ID is not set; nothing to do"
            exit 0
          fi
          python -m sites.yorokobu.yahoo_fetch --out data/yorokobu_yahoo.json
      - name: Store the result privately (the server's private folder, never the repository)
        env:
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
        run: python -m sites.yorokobu.privatedata push yorokobu_yahoo.json
