name: frequent-collect

# The group is empty since 2026-10-29: Otsu City ended its fire dispatch page (the only source here), so there is nothing to collect.
# The file stays so that the Apps Script trigger that still dispatches it every 15 minutes (docs/office/gas/github_triggers.gs) gets a success,
# not a failure, until that trigger is removed. No schedule: of its own.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Collect
        id: collect
        continue-on-error: true
        run: python -m sokuhou.run frequent
      - name: Commit data
        run: |
          git config user.name "sokuhou-bot"
          git config user.email "sokuhou-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: fire dispatch update"
            git pull --rebase origin main
            git push
          fi
      - name: Fail if any source failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
