name: frequent-collect

on:
  schedule:
    - cron: "*/15 * * * *"   # fire dispatch page keeps only ~10 recent incidents; we keep the history
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Collect
        id: collect
        continue-on-error: true
        run: python -m sokuhou.run frequent
      - name: Commit data
        run: |
          git config user.name "sokuhou-bot"
          git config user.email "sokuhou-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: fire dispatch update"
            git pull --rebase origin main
            git push
          fi
      - name: Fail if any source failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
