name: kuma-live

# kuma-sokuho.com: collects the municipal bear sightings (prefecture / city open data) once a day. When any data
# file changed, it is committed and ONLY the kuma site is deployed (deploy.yml, input "only"), so the site shows the
# newest records within minutes of the municipality publishing them, and the other sites are not rebuilt.
# A push made with the workflow token does not start other workflows, so the deploy is started explicitly below.

on:
  schedule:
    - cron: "20 21 * * 0"   # once a week, Monday 06:20 JST (owner decision 2026-11-13: demand fell and AdSense said no again; before: once a day, owner decision 2026-10-10). /cite/ says "週1回"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start deploy.yml for the kuma site

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # pypdf: Joetsu City's list (Niigata) is a PDF; every other kuma source uses only the standard library
      - name: Install
        run: python -m pip install --quiet -r requirements.txt
      - name: Collect
        id: collect
        continue-on-error: true   # keep what succeeded, then fail the job below
        run: python -m sokuhou.run kuma
      # week counts of the weekly digest are saved, so a week page stays after a municipality drops old rows (sites/kuma/digest_snapshot.py)
      - name: Save digest weeks
        continue-on-error: true
        run: python -m sites.kuma.digest_snapshot
      - name: Commit data
        id: commit
        run: |
          git config user.name "sokuhou-bot"
          git config user.email "sokuhou-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: kuma update"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the kuma site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f deploy=true -f only=kuma
      - name: Fail if any source failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
