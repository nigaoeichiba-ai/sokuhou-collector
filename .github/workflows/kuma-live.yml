name: kuma-live

# kuma-sokuho.com: collects the municipal bear sightings (prefecture / city open data) several times a day. When any data
# file changed, it is committed and ONLY the kuma site is deployed (deploy.yml, input "only"), so the site shows the
# newest records within minutes of the municipality publishing them, and the other sites are not rebuilt.
# A push made with the workflow token does not start other workflows, so the deploy is started explicitly below.

on:
  schedule:
    - cron: "20 */3 * * *"   # every 3 hours at :20 UTC (the municipalities update once a day to once a month)
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start deploy.yml for the kuma site

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # no pip install: the kuma sources use only the standard library (the PDF reader is imported lazily by the ministry's sources, which run in daily.yml)
      - name: Collect
        id: collect
        continue-on-error: true   # keep what succeeded, then fail the job below
        run: python -m sokuhou.run kuma
      - name: Commit data
        id: commit
        run: |
          git config user.name "sokuhou-bot"
          git config user.email "sokuhou-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: kuma update"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the kuma site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f deploy=true -f only=kuma
      - name: Fail if any source failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
