name: yorokobu-ranking

# [2026-10-17: the result is no longer committed to the public repository (the Rakuten terms bar keeping API data where many people can read it): it goes to the server's private
# folder, sites/yorokobu/privatedata.py, and the deploy takes it from there.]
# Every day: today's Rakuten Ichiba sales ranking of the gift genres and of the age/sex groups (about 40 lists x 4 pages), merged into data/yorokobu_ranking.json
# together with a 45-day history of the places, so the site can show what rose, what is new and what stays (sites/yorokobu/ranking.py).
# Nothing is committed (the file only goes to the private folder); data/yorokobu_ranking.json; the pages change at the next deploy (the daily one at 07:00 JST, or any push).  Needs RAKUTEN_APP_ID and RAKUTEN_ACCESS_KEY.

on:
  schedule:
    - cron: "50 20 * * *"   # 05:50 JST: the run takes about 30 minutes and must be on main before the 07:00 deploy (a commit made with the workflow token does not start a deploy by itself)
  workflow_dispatch:

permissions:
  contents: read

# Own group, NOT the deploy's `rakuten-api`: GitHub keeps only ONE waiting run per group and cancels an older waiting run when a newer one arrives,
# so a push cancelled a waiting ranking run (seen on 2026-10-07).  Ranking and deploy therefore run side by side without waiting for each other.  The shared
# Rakuten limit (one application ID, about one request a second) is kept by the ranking's slow pace: one request every 12 s (REQUEST_GAP in ranking.py)
# is 0.08 requests/s, which together with a deploy's fetch (about 0.9/s) stays within it.  A run takes about 30 minutes.
concurrency:
  group: yorokobu-ranking
  cancel-in-progress: false

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # about 160 requests at one every 12 s (32 minutes) plus the upload
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Take the earlier file from the private folder
        env:
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
        run: python -m sites.yorokobu.privatedata pull yorokobu_ranking.json
      - name: Fetch today's ranking
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          if [ -z "$RAKUTEN_APP_ID" ] || [ -z "$RAKUTEN_ACCESS_KEY" ]; then
            echo "the Rakuten secrets are not set; nothing to do"
            exit 0
          fi
          python -m sites.yorokobu.ranking --out data/yorokobu_ranking.json
      - name: Store the result privately (the server's private folder, never the repository)
        env:
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
        run: python -m sites.yorokobu.privatedata push yorokobu_ranking.json
