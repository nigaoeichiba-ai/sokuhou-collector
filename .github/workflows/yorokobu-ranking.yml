name: yorokobu-ranking

# Every day: today's Rakuten Ichiba sales ranking of the gift genres and of the age/sex groups (about 40 lists x 4 pages), merged into data/yorokobu_ranking.json
# together with a 45-day history of the places, so the site can show what rose, what is new and what stays (sites/yorokobu/ranking.py).
# The commit touches only data/yorokobu_ranking.json, which redeploys the gift site only.  Needs RAKUTEN_APP_ID and RAKUTEN_ACCESS_KEY.

on:
  schedule:
    - cron: "20 21 * * *"   # 06:20 JST, before the 07:00 deploy
  workflow_dispatch:

permissions:
  contents: write

# Own group, NOT the deploy's `rakuten-api`: GitHub keeps only ONE waiting run per group and cancels an older waiting run when a newer one arrives,
# so a push cancelled a waiting ranking run (seen on 2026-10-07).  Ranking and deploy therefore run side by side; the Rakuten limit (one application ID,
# about one request a second) is respected by the ranking's slow pace (one request every 2.5 s, set in ranking.py) and by the deploy's own retries.
# If a deploy ever fails with HTTP 429, make the ranking wait for it again.
concurrency:
  group: yorokobu-ranking
  cancel-in-progress: false

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # about 160 requests at one every 2.5 s (7 minutes) plus the commit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Fetch today's ranking
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          if [ -z "$RAKUTEN_APP_ID" ] || [ -z "$RAKUTEN_ACCESS_KEY" ]; then
            echo "the Rakuten secrets are not set; nothing to do"
            exit 0
          fi
          python -m sites.yorokobu.ranking --out data/yorokobu_ranking.json
      - name: Commit
        run: |
          git config user.name "sokuhou-bot"
          git config user.email "sokuhou-bot@users.noreply.github.com"
          git add data/yorokobu_ranking.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: yorokobu ranking snapshot"
            git pull --rebase origin main
            git push
          fi
