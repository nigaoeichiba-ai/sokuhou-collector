name: yorokobu-candidates

# Collects the shortlist of products per page and idea for the editors (Claude and Codex) to choose real picks from.
# Runs by hand or every Sunday (new pages only: pages that already have a shortlist keep it); it stores data/yorokobu_candidates.json privately
# (about 3 MB) and changes nothing on the live site.  Run it by hand with "all" ticked to redo every page.
# Needs the repository secrets RAKUTEN_APP_ID and RAKUTEN_ACCESS_KEY (already set for the deploy job).

on:
  schedule:
    - cron: "0 18 * * 0"   # Monday 03:00 JST
  workflow_dispatch:
    inputs:
      all:
        description: "Redo every page (otherwise only pages without a shortlist)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rakuten-api   # shared with the yorokobu deploy job: one application ID, one request per second
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Take the earlier file from the private folder
        env:
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
        run: python -m sites.yorokobu.privatedata pull yorokobu_candidates.json
      - name: Collect the shortlist
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then
            python -m sites.yorokobu.fetch --candidates --out data/yorokobu_candidates.json
          else
            python -m sites.yorokobu.fetch --candidates --new-only --out data/yorokobu_candidates.json
          fi
      - name: Store the result privately (the server's private folder, never the repository)
        env:
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
        run: python -m sites.yorokobu.privatedata push yorokobu_candidates.json
