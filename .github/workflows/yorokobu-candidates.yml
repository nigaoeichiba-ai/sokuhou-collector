name: yorokobu-candidates

# Collects the shortlist of products per page and idea for the editors (Claude and Codex) to choose real picks from.
# Runs by hand or every Sunday (new pages only: pages that already have a shortlist keep it); it commits data/yorokobu_candidates.json
# (about 3 MB) and changes nothing on the live site.  Run it by hand with "all" ticked to redo every page.
# Needs the repository secrets RAKUTEN_APP_ID and RAKUTEN_ACCESS_KEY (already set for the deploy job).

on:
  schedule:
    - cron: "0 18 * * 0"   # Monday 03:00 JST
  workflow_dispatch:
    inputs:
      all:
        description: "Redo every page (otherwise only pages without a shortlist)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Collect the shortlist
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then
            python -m sites.yorokobu.fetch --candidates --out data/yorokobu_candidates.json
          else
            python -m sites.yorokobu.fetch --candidates --new-only --out data/yorokobu_candidates.json
          fi
      - name: Commit
        run: |
          git config user.name "sokuhou-bot"
          git config user.email "sokuhou-bot@users.noreply.github.com"
          git add data/yorokobu_candidates.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: yorokobu candidate shortlist"
            git pull --rebase origin main
            git push
          fi
