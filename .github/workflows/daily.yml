name: daily-collect

on:
  schedule:
    - cron: "10 21 * * *"   # 06:10 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Collect
        id: collect
        continue-on-error: true   # keep what succeeded, then fail the job below
        run: python -m sokuhou.run daily
      - name: Commit data
        run: |
          git config user.name "sokuhou-bot"
          git config user.email "sokuhou-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: daily update"
            git pull --rebase origin main
            git push
          fi
      - name: Fail if any source failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
