name: inbox

# Copies new contact-form messages from the four servers into data/inbox/ ENCRYPTED (the repository is public, so a message, which may carry
# an e-mail address, is never stored in clear text).  Only the owner's PC holds the private key (~/.sokuhou/inbox_private.pem); the routines read
# the messages there with `python -m sokuhou.inbox read`.  Messages stay on the server too (<site folder>/inbox/*.jsonl).
# Needs the repository secrets XSERVER_SSH_KEY, XSERVER_HOST and XSERVER_USER (the same ones the deploy job uses).

on:
  schedule:
    - cron: "50 * * * *"   # every hour (a message reaches the owner within about an hour; was once a day at 03:50 JST)
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # the notice to the owner

concurrency:
  group: data-commit
  cancel-in-progress: false

env:
  SSH_PORT: "10022"

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Copy the new messages (encrypted)
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_ID: ${{ secrets.XSERVER_USER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER_ID" ]; then
            echo "XSERVER_SSH_KEY / XSERVER_HOST / XSERVER_USER are not all set; nothing to do"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          for try in 1 2 3 4 5 6; do   # the key scan sometimes comes back empty for a moment
            ssh-keyscan -T 10 -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            [ -s ~/.ssh/known_hosts ] && break
            sleep $((try * 5))
          done
          stamp=$(date -u +%Y%m%d-%H%M)
          mkdir -p data/inbox
          for pair in saichin:saichin-sokuho.com kuma:kuma-sokuho.com yorokobu:yorokobu-present.com minna:minna-no-illust.com; do
            site="${pair%%:*}"; dir="${pair##*:}"
            if ! ssh -i ~/.ssh/id_xserver -p "$SSH_PORT" -o BatchMode=yes "$USER_ID@$HOST" \
                 "cd \"\$HOME/$dir/inbox\" 2>/dev/null && for f in *.jsonl; do if [ -f \"\$f\" ]; then echo \"== \$f\"; cat \"\$f\"; fi; done; true" > "raw_$site.txt"; then
              echo "ssh failed for $site; skipped"
              continue
            fi
            python -m sokuhou.inbox new --site "$site" --raw "raw_$site.txt" --state data/inbox/state.json --out "new_$site.jsonl"
            if [ -s "new_$site.jsonl" ]; then
              openssl smime -encrypt -aes256 -binary -in "new_$site.jsonl" -out "data/inbox/$site-$stamp.p7m" -outform DER sokuhou/inbox_cert.pem
              python -m sokuhou.inbox summary --site "$site" --file "new_$site.jsonl" >> notice.txt   # site, count and kinds only: never the text
            fi
          done
          rm -f raw_*.txt new_*.jsonl
      - name: Commit
        run: |
          git config user.name "sokuhou-bot"
          git config user.email "sokuhou-bot@users.noreply.github.com"
          git add data/inbox
          if git diff --cached --quiet; then
            echo "no new messages"
          else
            git commit -m "data: inbox (encrypted)"
            git pull --rebase origin main
            git push
          fi
      - name: Tell the owner (a GitHub issue: GitHub e-mails it; the text of the messages is NOT in it, the repository is public)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s notice.txt ]; then
            { echo "新しい問い合わせが届きました(内容は暗号化されています。件数と種類だけを書いています)。"; echo; sed 's/^/- /' notice.txt; echo; \
              echo "読むには、PCで次のコマンドを実行してください: python -m sokuhou.inbox read --mark"; \
              echo "「掲載内容に関するご連絡(掲載の中止のご依頼など)」は、早めに読んでください。"; } > issue_body.md
            gh issue create --title "新しい問い合わせ: $(cut -d: -f1 notice.txt | sort -u | paste -sd, -)" --body-file issue_body.md
          fi
