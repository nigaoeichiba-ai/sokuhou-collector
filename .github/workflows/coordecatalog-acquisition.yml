        """Daily private refresh. Never writes a website or the source site's data."""
        from pathlib import Path
        from datetime import datetime, timezone
        from urllib.parse import urlsplit
        from urllib.request import Request, build_opener, HTTPRedirectHandler
        import copy, hashlib, json, re, subprocess, tempfile, time, uuid

        from runner import PrivateChannel, QuietGate, ExistingProviderAdapter, execute, now, NAMESPACE
        from acquisition_worker import validate_plan
        from variant_reader import MAX_BODY, VariantError, canonical_product_url, verify_registered_variant
        from schedule_plan import partition_plan, part_request_id, merge_results


        def fingerprint(plan):
            return hashlib.sha256(json.dumps(plan, sort_keys=True, ensure_ascii=False).encode()).hexdigest()


        def stamp(value):
            try:
                d=datetime.fromisoformat(value.replace('Z','+00:00'))
                return d if d.tzinfo else None
            except (AttributeError,TypeError,ValueError):
                return None


        def still_fresh(result):
            """Retain completed partial observations for one day; display allows two hours of scheduler delay."""
            if not isinstance(result,dict):return True
            dates=[product.get('checked_at') for product in result.get('products',{}).values()]
            if not dates and result.get('actual_calls',0):dates=[result.get('finished_at') or result.get('updated_at')]
            for value in dates:
                date=stamp(value)
                if not date or date>datetime.now(timezone.utc):raise ValueError('invalid_saved_fact_date')
                if (datetime.now(timezone.utc)-date).total_seconds()>=24*3600:return False
            return True


        class ScheduledChannel(PrivateChannel):
            def schedule_read(self, name):
                if name not in ('config','checkpoint','latest'):
                    raise ValueError('invalid_schedule_path')
                command='p="$HOME/'+NAMESPACE+'/schedule/'+name+'.json"; [ -f "$p" ] || exit 44; cat "$p"'
                r=subprocess.run(self.base+[command],capture_output=True,timeout=30)
                if r.returncode==44:return None
                if r.returncode or not r.stdout or len(r.stdout)>8_000_000:raise ValueError('schedule_read_failed')
                return json.loads(r.stdout)

            def schedule_write(self,name,value):
                if name not in ('checkpoint','latest','status'):raise ValueError('invalid_schedule_path')
                body=json.dumps(value,ensure_ascii=False,separators=(',',':')).encode()
                if len(body)>8_000_000:raise ValueError('schedule_result_too_large')
                command=('umask 077; d="$HOME/'+NAMESPACE+'/schedule"; [ ! -L "$d" ] || exit 18; mkdir -p "$d"; '
                         't="$d/.'+name+'.$$"; cat > "$t" && chmod 600 "$t" && mv "$t" "$d/'+name+'.json"')
                r=subprocess.run(self.base+[command],input=body,capture_output=True,timeout=30)
                if r.returncode:raise ValueError('schedule_write_failed')


        class ProductCycle:
            def __init__(self,channel,bundle,checkpoint):
                self.channel=channel;self.bundle=bundle;self.checkpoint=checkpoint

            def read(self,request_id,area):
                if request_id!=self.checkpoint['cycle_id']:raise ValueError('cycle_identity_mismatch')
                return self.bundle if area=='requests' else self.checkpoint.get('product_result')

            def write(self,request_id,result):
                if request_id!=self.checkpoint['cycle_id']:raise ValueError('cycle_identity_mismatch')
                self.checkpoint['product_result']=copy.deepcopy(result)
                self.channel.schedule_write('checkpoint',self.checkpoint)


        class ProductPart:
            def __init__(self,channel,plan,checkpoint,index,created_at):
                self.channel=channel;self.plan=plan;self.checkpoint=checkpoint;self.index=index;self.created_at=created_at
                self.rid=part_request_id(checkpoint['cycle_id'],index)

            def read(self,request_id,area):
                if request_id!=self.rid:raise ValueError('part_identity_mismatch')
                if area=='requests':return {'request_id':self.rid,'plan':self.plan,'created_at':self.created_at}
                return self.checkpoint.get('product_parts',{}).get(str(self.index))

            def write(self,request_id,result):
                if request_id!=self.rid:raise ValueError('part_identity_mismatch')
                self.checkpoint.setdefault('product_parts',{})[str(self.index)]=copy.deepcopy(result)
                self.channel.schedule_write('checkpoint',self.checkpoint)


        class FixedRedirect(HTTPRedirectHandler):
            def __init__(self,url):super().__init__();self.host=urlsplit(url).hostname
            def redirect_request(self,req,fp,code,msg,headers,newurl):
                u=urlsplit(newurl)
                if u.scheme!='https' or u.hostname!=self.host or u.username or u.password or u.port:
                    raise VariantError('redirect_rejected')
                return super().redirect_request(req,fp,code,msg,headers,newurl)


        def fetch_merchant(url,allowed):
            if url not in allowed or canonical_product_url(url)!=url:raise VariantError('unregistered_url')
            deadline=time.monotonic()+15
            opener=build_opener(FixedRedirect(url))
            req=Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; CoordeCatalogPrivateCheck/1.0)',
                                     'Accept':'text/html,application/xhtml+xml'})
            with opener.open(req,timeout=15) as response:
                size=response.headers.get('Content-Length','')
                if size.isdigit() and int(size)>MAX_BODY:raise VariantError('response_too_large')
                chunks=[];total=0
                while True:
                    remaining=deadline-time.monotonic()
                    if remaining<=0:raise TimeoutError('deadline')
                    sock=getattr(getattr(getattr(response,'fp',None),'raw',None),'_sock',None)
                    if sock is not None:sock.settimeout(remaining)
                    block=response.read(min(65536,MAX_BODY+1-total))
                    if not block:break
                    chunks.append(block);total+=len(block)
                    if total>MAX_BODY:raise VariantError('response_too_large')
                return b''.join(chunks)


        def offer_specs(plan):
            return {oid:{'id':oid,**spec} for oid,spec in plan['offers'].items()}


        def retained(row,offer):
            if not isinstance(row,dict):return None
            q=row if row.get('identity_verified') is True else row.get('last_confirmed')
            if not isinstance(q,dict) or q.get('identity_verified') is not True:return None
            if any(q.get(k)!=offer.get(k) for k in ['id','product_url','api_item_code','variant_id']):return None
            if q.get('registered_options')!=offer.get('selected_options',[]):return None
            return copy.deepcopy(q)


        def unconfirmed(offer,checked,previous):
            q={'id':offer['id'],'product_url':offer['product_url'],'api_item_code':offer['api_item_code'],
               'variant_id':offer['variant_id'],'registered_options':offer.get('selected_options') or [],
               'observed_options':[],'identity_verified':False,'price_jpy':None,'available':None,
               'checked_at':checked,'price_checked_at':None,'stock_checked_at':None,'status':'merchant_confirmation_failed',
               'quote_kind':'snapshot','stock_scope':'unconfirmed','source':'merchant_registered_variant'}
            old=retained(previous,offer)
            if old:q['last_confirmed']=old
            return q


        def validate_config(config):
            if (not isinstance(config,dict) or set(config)!={'version','enabled','request_id','plan_sha256','interval_hours','website_sync_enabled'}
                    or config['version']!=1 or type(config['enabled']) is not bool or config['interval_hours']!=24
                    or config['website_sync_enabled'] is not False
                    or not re.fullmatch('[0-9a-f]{32}',str(config['request_id']))
                    or not re.fullmatch('[0-9a-f]{64}',str(config['plan_sha256']))):
                raise ValueError('invalid_schedule_config')
            return config


        def run_schedule(channel,gate,client,directory,*,clock=time.monotonic,sleep=time.sleep,
                         fetch=fetch_merchant,api_execute=execute,deadline_seconds=900,force=False):
            config=validate_config(channel.schedule_read('config'))
            if not config['enabled']:return {'status':'disabled','publication':False}
            seed=channel.read(config['request_id'],'requests')
            if not isinstance(seed,dict) or seed.get('request_id')!=config['request_id']:raise ValueError('invalid_seed_request')
            plan=seed.get('plan');parts=partition_plan(plan)
            if fingerprint(plan)!=config['plan_sha256']:
                raise ValueError('schedule_plan_mismatch')
            latest=channel.schedule_read('latest')
            if latest and latest.get('plan_sha256')==config['plan_sha256'] and latest.get('status')=='complete':
                date=stamp(latest.get('finished_at'))
                if not date or date>datetime.now(timezone.utc):raise ValueError('invalid_schedule_date')
                if not force and (datetime.now(timezone.utc)-date).total_seconds()<24*3600:
                    return {'status':'already_fresh','publication':False}
            checkpoint=channel.schedule_read('checkpoint')
            if checkpoint and checkpoint.get('plan_sha256')==config['plan_sha256'] and checkpoint.get('status')=='paused_source_busy_or_unverified':
                if not re.fullmatch('[0-9a-f]{32}',str(checkpoint.get('cycle_id'))):raise ValueError('invalid_cycle_identity')
                checkpoint=copy.deepcopy(checkpoint)
            else:
                checkpoint={'version':1,'cycle_id':uuid.uuid4().hex,'plan_sha256':config['plan_sha256'],
                            'status':'running','started_at':now(),'registered_quotes':{'version':1,'offers':{}},
                            'merchant_urls_completed':[],'publication':False,'yorokobu_modified':False,'website_uploaded':False}
            cid=checkpoint['cycle_id'];bundle={'request_id':cid,'plan':plan,'created_at':seed['created_at']}
            checkpoint['status']='running'
            if not still_fresh(checkpoint.get('product_result')):
                checkpoint.pop('product_result',None)
            api_deadline=clock()+deadline_seconds
            def budgeted_gate():
                return clock()<api_deadline and gate()
            if len(parts)==1:
                result=api_execute(ProductCycle(channel,bundle,checkpoint),cid,budgeted_gate,client,directory,deadline_seconds=deadline_seconds)
            else:
                stored=checkpoint.get('product_parts',{})
                if not isinstance(stored,dict) or any(k not in {str(i) for i in range(len(parts))} for k in stored):
                    raise ValueError('invalid_part_checkpoint')
                for key,record in list(stored.items()):
                    if not still_fresh(record):del stored[key]
                checkpoint['product_parts']=stored
                for index,part in enumerate(parts):
                    existing=stored.get(str(index))
                    if existing and existing.get('status')=='complete':
                        if existing.get('request_id')!=part_request_id(cid,index) or existing.get('plan_sha256')!=fingerprint(part):
                            raise ValueError('invalid_completed_part')
                        continue
                    remaining=api_deadline-clock()
                    if remaining<=0:
                        checkpoint['status']='paused_source_busy_or_unverified';channel.schedule_write('checkpoint',checkpoint)
                        return {'status':checkpoint['status'],'actual_calls':sum(r.get('actual_calls',0) for r in stored.values()),'publication':False}
                    result=api_execute(ProductPart(channel,part,checkpoint,index,seed['created_at']),part_request_id(cid,index),
                        budgeted_gate,client,Path(directory)/('part-'+str(index)),deadline_seconds=max(1,int(remaining)))
                    stored=checkpoint['product_parts']
                    if result['status']!='complete':
                        checkpoint['status']=result['status'];channel.schedule_write('checkpoint',checkpoint)
                        channel.schedule_write('status',{'status':result['status'],'actual_calls':sum(r.get('actual_calls',0) for r in stored.values()),
                            'parts_completed':sum(r.get('status')=='complete' for r in stored.values()),'parts_total':len(parts),'updated_at':now(),'publication':False})
                        return {'status':result['status'],'actual_calls':sum(r.get('actual_calls',0) for r in stored.values()),'publication':False}
                result=merge_results(plan,parts,[stored[str(i)] for i in range(len(parts))],cid)
            checkpoint['product_result']=result
            if result['status']!='complete':
                checkpoint['status']=result['status'];channel.schedule_write('checkpoint',checkpoint)
                channel.schedule_write('status',{'status':result['status'],'actual_calls':result['actual_calls'],
                                                'updated_at':now(),'publication':False})
                return {'status':result['status'],'actual_calls':result['actual_calls'],'publication':False}
            offers=offer_specs(plan);grouped={}
            for oid,o in offers.items():
                if canonical_product_url(o['product_url'])!=o['product_url']:raise ValueError('invalid_registered_url')
                grouped.setdefault(o['product_url'],[]).append(o)
            completed=checkpoint.get('merchant_urls_completed',[])
            quotes=checkpoint.get('registered_quotes',{}).get('offers',{})
            if (not isinstance(completed,list) or len(completed)!=len(set(completed)) or not set(completed).issubset(grouped)
                    or not isinstance(quotes,dict) or set(quotes)!={o['id'] for url in completed for o in grouped[url]}):
                raise ValueError('invalid_merchant_checkpoint')
            for url in list(completed):
                observed=[stamp(quotes[o['id']].get('checked_at')) for o in grouped[url]]
                if any(not d or d>datetime.now(timezone.utc) for d in observed):raise ValueError('invalid_saved_SKU_date')
                if any((datetime.now(timezone.utc)-d).total_seconds()>=24*3600 for d in observed):
                    completed.remove(url)
                    for o in grouped[url]:quotes.pop(o['id'],None)
            # Existing facts are only fallback facts, retaining their original dates.
            old_quotes=(latest or {}).get('registered_quotes',{}).get('offers',{})
            deadline=clock()+deadline_seconds;last=None;network_calls=0
            for url,variants in grouped.items():
                if url in completed:continue
                while clock()<deadline and not gate():sleep(15)
                if clock()>=deadline:
                    checkpoint['status']='paused_source_busy_or_unverified';channel.schedule_write('checkpoint',checkpoint)
                    return {'status':checkpoint['status'],'actual_calls':result['actual_calls'],'merchant_urls_checked':len(completed),'publication':False}
                if last is not None:sleep(max(0,1.6-(clock()-last)))
                while clock()<deadline and not gate():sleep(15)
                if clock()>=deadline:
                    checkpoint['status']='paused_source_busy_or_unverified';channel.schedule_write('checkpoint',checkpoint)
                    return {'status':checkpoint['status'],'actual_calls':result['actual_calls'],'merchant_urls_checked':len(completed),'publication':False}
                last=clock();checked=now();network_calls+=1
                try:
                    body=fetch(url,set(grouped))
                    for offer in variants:
                        q=verify_registered_variant(body,offer,checked)
                        if q.get('status')!='live_variant':
                            q=unconfirmed(offer,checked,old_quotes.get(offer['id']))
                        quotes[offer['id']]=q
                except Exception:
                    for offer in variants:quotes[offer['id']]=unconfirmed(offer,checked,old_quotes.get(offer['id']))
                completed.append(url)
                checkpoint['registered_quotes']={'version':1,'checked_at':checked,'offers':quotes}
                checkpoint['merchant_urls_completed']=completed
                channel.schedule_write('checkpoint',checkpoint)
            if set(quotes)!=set(offers):raise ValueError('incomplete_merchant_confirmation')
            finished=now();checkpoint.update(status='complete',finished_at=finished,
                seed_request_id=config['request_id'],merchant_network_calls=network_calls)
            checkpoint['registered_quotes'].update(complete=True,checked_at=finished,registered_offers=len(offers))
            channel.schedule_write('latest',checkpoint);channel.schedule_write('checkpoint',checkpoint)
            safe={'status':'complete','actual_calls':result['actual_calls'],'registered_offers':len(offers),
                  'selected_SKUs_confirmed':sum(q.get('status')=='live_variant' for q in quotes.values()),
                  'merchant_products':len(completed),'publication':False,'website_uploaded':False}
            channel.schedule_write('status',{**safe,'updated_at':finished})
            return safe


        def main():
            with tempfile.TemporaryDirectory(prefix='catalog-scheduled-refresh-') as directory:
                try:
                    channel=ScheduledChannel(directory)
                    result=run_schedule(channel,QuietGate(),ExistingProviderAdapter(),directory)
                    print(json.dumps(result))
                except Exception:
                    print('scheduled_refresh_failed_without_website_or_source_changes')
                    raise SystemExit(1) from None


        if __name__=='__main__':main()

