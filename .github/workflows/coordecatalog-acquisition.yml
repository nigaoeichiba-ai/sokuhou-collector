        """Bounded whole-catalog refresh plans, partitioned into existing75-call jobs."""
        import copy,hashlib,json,re
        from acquisition_worker import validate_plan

        MAX_PRODUCTS=1000
        MAX_OFFERS=4000
        PART_SIZE=75


        def fingerprint(plan):
            return hashlib.sha256(json.dumps(plan,sort_keys=True,ensure_ascii=False).encode()).hexdigest()


        def partition_plan(plan):
            if (not isinstance(plan,dict) or plan.get('version')!=1 or plan.get('purpose')!='registered_catalog'
                    or plan.get('publication') is not False or not isinstance(plan.get('requests'),list)
                    or not isinstance(plan.get('offers'),dict) or not 1<=len(plan['offers'])<=MAX_OFFERS
                    or not 1<=len(plan['requests'])<=MAX_PRODUCTS or plan.get('planned_calls')!=len(plan['requests'])):
                raise ValueError('invalid_whole_catalog_plan')
            if len(json.dumps(plan,ensure_ascii=False).encode())>1_900_000:raise ValueError('whole_catalog_plan_too_large')
            forbidden={'applicationId','accessKey','authorization','token','password','secret'}
            def visit(value):
                if isinstance(value,dict):
                    if forbidden.intersection(value):raise ValueError('authentication_in_plan')
                    for v in value.values():visit(v)
                elif isinstance(value,list):
                    for v in value:visit(v)
            visit(plan)
            seen=set();parts=[];products=set()
            for offset in range(0,len(plan['requests']),PART_SIZE):
                requests=plan['requests'][offset:offset+PART_SIZE];ids=[]
                for request in requests:
                    if request.get('kind')!='registered':raise ValueError('scheduled_search_not_allowed')
                    key=request.get('expected_item_code') or request.get('expected_product_url')
                    if key in products:raise ValueError('duplicate_product_request')
                    products.add(key)
                    for oid in request.get('offer_ids',[]):
                        if oid in seen:raise ValueError('duplicate_registered_offer')
                        seen.add(oid);ids.append(oid)
                if any(oid not in plan['offers'] for oid in ids):raise ValueError('unknown_registered_offer')
                part=copy.deepcopy(plan);part['requests']=copy.deepcopy(requests)
                part['offers']={oid:copy.deepcopy(plan['offers'][oid]) for oid in ids};part['planned_calls']=len(requests)
                validate_plan(part);parts.append(part)
            if seen!=set(plan['offers']):raise ValueError('orphan_registered_offer')
            return parts


        def part_request_id(cycle_id,index):
            if not re.fullmatch('[0-9a-f]{32}',str(cycle_id)) or type(index) is not int or not 0<=index<14:
                raise ValueError('invalid_part_identity')
            return hashlib.sha256((cycle_id+':'+str(index)).encode()).hexdigest()[:32]


        def merge_results(plan,parts,results,cycle_id):
            if len(parts)!=len(results) or not parts:raise ValueError('incomplete_product_parts')
            merged={'version':1,'request_id':cycle_id,'run_id':cycle_id,'status':'complete',
                'planned_calls':plan['planned_calls'],'actual_calls':0,'products':{},'offers':{},'requests':[],
                'new_candidates':[],'publication':False,'yorokobu_modified':False,'plan_sha256':fingerprint(plan)}
            offset=0
            for index,(part,result) in enumerate(zip(parts,results)):
                if (not isinstance(result,dict) or result.get('status')!='complete'
                        or result.get('request_id')!=part_request_id(cycle_id,index)
                        or result.get('plan_sha256')!=fingerprint(part)
                        or result.get('actual_calls')!=part['planned_calls']
                        or set(result.get('offers',{}))!=set(part['offers'])
                        or result.get('publication') is not False or result.get('yorokobu_modified') is not False):
                    raise ValueError('invalid_product_part')
                for code,product in result['products'].items():
                    if code in merged['products']:raise ValueError('overlapping_product_parts')
                    merged['products'][code]=copy.deepcopy(product)
                merged['offers'].update(copy.deepcopy(result['offers']))
                for r in result.get('requests',[]):merged['requests'].append({**r,'ordinal':offset+r['ordinal']})
                merged['actual_calls']+=result['actual_calls'];offset+=part['planned_calls']
            if set(merged['offers'])!=set(plan['offers']):raise ValueError('incomplete_merged_offers')
            merged['started_at']=min(r['started_at'] for r in results)
            merged['finished_at']=max(r['finished_at'] for r in results)
            return merged

        CATALOG_PY
